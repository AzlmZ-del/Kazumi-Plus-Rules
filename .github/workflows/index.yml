name: 重新生成规则索引

on:
  push:
    branches: [main]
    # 自动提交只含这两个文件；忽略它们才不会自我触发。
    # 漏掉 README.md 会让 CI 的提交再触发一轮（靠第二轮 diff 为空才停）。
    paths-ignore:
      - "index.json"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成 index.json 与更新记录表
        run: python3 tools/gen_index.py

      - name: 提交变更
        run: |
          if git diff --quiet -- index.json README.md; then
            echo "index.json 与 README 都没有变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json README.md
          git commit -m "chore: 重新生成 index.json"
          git push
